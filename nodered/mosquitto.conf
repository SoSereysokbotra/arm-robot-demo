# Mosquitto config for the robot arm project.
# Mosquitto 2.x only listens on localhost by default; this opens port 1883
# on all interfaces so the ESP32 can connect over Wi-Fi.
#
# Run from an Administrator PowerShell:
#   & "C:\Program Files\mosquitto\mosquitto.exe" -c "<path-to-this-file>" -v

# Plain MQTT - used by the ESP32, Node-RED and the Python tools
listener 1883 0.0.0.0

# MQTT over WebSockets - used by the 3D simulation page (sim/arm3d.html),
# because browsers cannot open raw MQTT/TCP sockets.
listener 9001 0.0.0.0
protocol websockets

allow_anonymous true
