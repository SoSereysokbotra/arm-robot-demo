; PlatformIO project configuration for the ESP32 robot arm controller
; Docs: https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial monitor (matches Serial.begin(115200) in main.cpp)
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Library dependencies (Adafruit_BusIO is pulled in automatically)
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@^3.0.2
    knolleary/PubSubClient@^2.8

build_flags =
    -Wall
